<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote · Ostendo</title>
<style>
  :root { --bg: #1e2030; --text: #c8d3f5; --accent: #82aaff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  header {
    display: flex; justify-content: space-between;
    padding: 14px 18px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    opacity: 0.6;
  }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 8px 18px 32px; }
  h1 { font-size: 1.45rem; line-height: 1.3; margin: 12px 0 22px; }
  .option {
    position: relative; overflow: hidden;
    display: flex; justify-content: space-between; gap: 12px;
    width: 100%; margin: 0 0 12px; padding: 16px 18px;
    font: inherit; text-align: left; color: var(--text);
    background: color-mix(in srgb, var(--text) 7%, var(--bg));
    border: 2px solid color-mix(in srgb, var(--text) 18%, var(--bg));
    border-radius: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .option:not(:disabled):active { transform: scale(0.98); }
  .option:disabled { cursor: default; }
  .option.chosen { border-color: var(--accent); }
  .option .fill {
    position: absolute; inset: 0 auto 0 0; width: 0;
    background: color-mix(in srgb, var(--accent) 28%, transparent);
    transition: width 0.5s ease;
  }
  .option span { position: relative; }
  .option .n { opacity: 0.55; margin-right: 10px; }
  .option .count { font-variant-numeric: tabular-nums; opacity: 0.85; }
  .total { opacity: 0.6; text-align: center; margin-top: 18px; }
  .waiting { opacity: 0.6; text-align: center; margin-top: 30vh; }
</style>
</head>
<body>
<header><span>Ostendo · Live poll</span><span id="status">connecting…</span></header>
<main id="main"><p class="waiting">Waiting for the next poll…</p></main>
<script>
var main = document.getElementById("main");
var statusEl = document.getElementById("status");
var ws = null, poll = null, memory = {};

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// A refresh opens a new connection, which the server would let vote again.
function myVote(id) {
  if (id in memory) return memory[id];
  try { return localStorage.getItem("ostendo-vote-" + id); } catch (e) { return null; }
}

function render() {
  main.textContent = "";
  if (!poll || !poll.id) {
    main.appendChild(el("p", "waiting", "Waiting for the next poll…"));
    return;
  }
  main.appendChild(el("h1", "", poll.question));
  var mine = myVote(poll.id);
  var total = poll.counts.reduce(function (a, b) { return a + b; }, 0);
  poll.options.forEach(function (text, i) {
    var button = el("button", "option" + (mine === String(i) ? " chosen" : ""));
    button.disabled = mine !== null;
    var fill = el("i", "fill");
    button.appendChild(fill);
    var label = el("span");
    label.appendChild(el("span", "n", String(i + 1)));
    label.appendChild(document.createTextNode(text));
    button.appendChild(label);
    if (mine !== null) {
      button.appendChild(el("span", "count", String(poll.counts[i])));
      fill.style.width = total ? (100 * poll.counts[i] / total) + "%" : "0";
    }
    button.onclick = function () { vote(i); };
    main.appendChild(button);
  });
  if (mine !== null) main.appendChild(el("p", "total", total + (total === 1 ? " vote" : " votes")));
}

function vote(i) {
  if (!ws || ws.readyState !== 1 || myVote(poll.id) !== null) return;
  ws.send(JSON.stringify({ type: "vote", poll: poll.id, option: i }));
  memory[poll.id] = String(i);
  try { localStorage.setItem("ostendo-vote-" + poll.id, String(i)); } catch (e) {}
  render();
}

function connect() {
  ws = new WebSocket("ws://" + location.host + "/");
  ws.onopen = function () { statusEl.textContent = "live"; };
  ws.onmessage = function (e) {
    var d = JSON.parse(e.data);
    var s = document.documentElement.style;
    if (d.bg) {
      s.setProperty("--bg", d.bg);
      s.setProperty("--text", d.text);
      s.setProperty("--accent", d.accent);
    }
    poll = d;
    render();
  };
  ws.onclose = function () {
    statusEl.textContent = "reconnecting…";
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>
