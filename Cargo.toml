[package]
name = "ostendo"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
description = "AI-native terminal presentation tool — markdown to slides in your terminal"
license = "GPL-3.0-only"
repository = "https://github.com/ZoneMix/ostendo"

[[bin]]
name = "ostendo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
figlet-rs = "0.1"
icy_sixel = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fast_image_resize = "5"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
unicode-width = "0.2"
url = "2"
resvg = "0.47.0"
subtle = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Thin LTO keeps local release builds quick; published binaries use `dist`.
[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
